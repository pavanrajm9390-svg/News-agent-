<!DOCTYPE html>

    <style>

      .story-meta { color: #708eb8; font-size: 0.72rem; margin-top: 0.25rem; }

      .card { background: #111a2d; border-color: #26324b; }
      .topic-pill { background: #1a2540; border-color: #30405f; }

      /* Signal Room direction for the live News Pulse dashboard. */
      :root { --signal-accent: #796af5; --signal-mint: #2bd7b0; --signal-line: #2c3c59; }

      .app-main { position: relative; background: radial-gradient(ellipse at 75% -8%, #5044a042 0, transparent 42%), radial-gradient(ellipse at 20% 76%, #22396b66 0, transparent 47%), linear-gradient(145deg, #080d1b, #101936); }
      .app-main::before { content: ''; position: absolute; width: min(36vw, 480px); height: min(36vw, 480px); right: 5%; top: 8%; border-radius: 50%; background: #6a5ff51d; filter: blur(100px); pointer-events: none; animation: signalAmbient 13s ease-in-out infinite alternate; }
      .page-container { position: relative; z-index: 1; }
